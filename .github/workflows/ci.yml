name: CI

# Both implementations run the same conformance cases. If they ever disagree,
# this is where it shows up rather than in someone's repository.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    # Every supported version, because a note written under one interpreter is
    # checked under another. The golden fingerprints in tests/ are what would
    # catch `ast` changing shape between versions and taking every note with it.
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, end-to-end and conformance tests
        run: python -m unittest -v
        working-directory: python

  package:
    # What `pip install chesterton` will get, built and installed the way a
    # stranger would: outside the source tree, so a module that is only found
    # because the tests run from python/ cannot pass here. Without this the
    # package is first built on release day, and a PyPI version number that
    # ships broken can never be used again.
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"  # the oldest requires-python allows: asof:python-version
      - name: The packaged licence is the repository's licence
        run: cmp LICENSE python/LICENSE
      - name: Build, and check what PyPI will render
        run: |
          python -m pip install --upgrade build twine
          python -m build python
          python -m twine check --strict python/dist/*
      - name: Install the wheel in a clean environment and use it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install python/dist/*.whl
          unzip -l python/dist/*.whl | grep -q 'dist-info/licenses/LICENSE'
          cd "$RUNNER_TEMP"
          fence="$RUNNER_TEMP/venv/bin/fence"
          "$fence" --version
          git init -q demo && cd demo
          git config user.email ci@example.com && git config user.name CI
          printf 'def f(r):\n    if r.ok and "error" not in r.body:\n        return r\n' > client.py
          git add -A && git commit -qm init
          "$fence" init
          "$fence" add client.py:2 -m "the vendor returns 200 on auth failure"
          git add -A && git commit -qm "record why"
          # Deleting the guarded line must be refused by the hook.
          printf 'def f(r):\n    return r\n' > client.py
          if git commit -qam "simplify"; then
            echo "::error::the installed fence did not block removing a recorded line"; exit 1
          fi

  claims:
    # The numbers the documents state, checked by asof (its sibling tool).
    # Today that is the oldest supported Python, written in both READMEs,
    # requires-python and the package job above; the root README once said
    # 3.10+ while the package required 3.11, and nothing noticed.
    name: claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned by commit, like every tool that checks this build. This commit is
      # the first that reads requires-python and .github; move the pin to asof's
      # v0.4.1 tag once it exists.
      - uses: Blueangelman36/asof@698c7a3b7bb61db67e8dcb755323d2935151f11c

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: cargo --version && rustc --version
      - name: Conformance cases and the end-to-end command
        run: cargo test -- --nocapture
        working-directory: rust

  action:
    # The action other repositories pin, run against this repository's own
    # notes. They were written by the Python build, so that is the one asked;
    # --strict fails if any of them stopped being compared.
    name: action (${{ matrix.implementation }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # the reasons comment, from the Python leg only
    strategy:
      fail-fast: false
      matrix:
        implementation: [python, rust]
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          implementation: ${{ matrix.implementation }}
          # The Rust build reads these notes as another scheme, which is the
          # case --strict exists to catch; here it only has to run cleanly.
          args: ${{ matrix.implementation == 'python' && 'check --strict' || 'check' }}
          # One writer, so two legs never race to create the same comment.
          comment-on-pr: ${{ matrix.implementation == 'python' }}
