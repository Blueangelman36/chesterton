name: CI

# Both implementations run the same conformance cases. If they ever disagree,
# this is where it shows up rather than in someone's repository.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    # Every supported version, because a note written under one interpreter is
    # checked under another. The golden fingerprints in tests/ are what would
    # catch `ast` changing shape between versions and taking every note with it.
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, end-to-end and conformance tests
        run: python -m unittest -v
        working-directory: python

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: cargo --version && rustc --version
      - name: Conformance cases and the end-to-end command
        run: cargo test -- --nocapture
        working-directory: rust

  action:
    # The action other repositories pin, run against this repository's own
    # notes. They were written by the Python build, so that is the one asked;
    # --strict fails if any of them stopped being compared.
    name: action (${{ matrix.implementation }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # the reasons comment, from the Python leg only
    strategy:
      fail-fast: false
      matrix:
        implementation: [python, rust]
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          implementation: ${{ matrix.implementation }}
          # The Rust build reads these notes as another scheme, which is the
          # case --strict exists to catch; here it only has to run cleanly.
          args: ${{ matrix.implementation == 'python' && 'check --strict' || 'check' }}
          # One writer, so two legs never race to create the same comment.
          comment-on-pr: ${{ matrix.implementation == 'python' }}
