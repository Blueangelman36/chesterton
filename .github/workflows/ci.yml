name: CI

# Both implementations run the same conformance cases. If they ever disagree,
# this is where it shows up rather than in someone's repository.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    # Every supported version, because a note written under one interpreter is
    # checked under another. The golden fingerprints in tests/ are what would
    # catch `ast` changing shape between versions and taking every note with it.
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, end-to-end and conformance tests
        run: python -m unittest -v
        working-directory: python

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: cargo --version && rustc --version
      - name: Conformance cases and the end-to-end command
        run: cargo test -- --nocapture
        working-directory: rust
