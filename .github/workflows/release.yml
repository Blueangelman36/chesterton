name: Release

# Publishes to PyPI when a version tag is pushed, through trusted publishing: PyPI
# accepts a short-lived OIDC token from this exact workflow, so there is no API
# token to store, rotate, or leak.
#
# One-time setup on PyPI, before the first tag (see docs/RELEASING.md):
#   PyPI project -> Publishing -> add a GitHub publisher with
#     owner: Blueangelman36   repository: chesterton
#     workflow: release.yml   environment: pypi
# and create a `pypi` environment in the repository settings. Requiring the
# environment means a tag alone cannot publish: the run has to pass through it.
#
# Nothing here runs on a normal push. A release happens only when someone tags.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests must pass before anything is built
        run: python -m unittest
        working-directory: python
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build
        working-directory: python
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: python/dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # the OIDC token trusted publishing uses, and nothing else
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
