name: Release

# Publishes to PyPI when a version tag is pushed, through trusted publishing: PyPI
# accepts a short-lived OIDC token from this exact workflow, so there is no API
# token to store, rotate, or leak.
#
# One-time setup on PyPI, before the first tag (see docs/RELEASING.md):
#   PyPI project -> Publishing -> add a GitHub publisher with
#     owner: Blueangelman36   repository: chesterton
#     workflow: release.yml   environment: pypi
# and create a `pypi` environment in the repository settings. Requiring the
# environment means a tag alone cannot publish: the run has to pass through it.
# Then set the repository variable PUBLISH_TO_PYPI to `true`. Until then the
# publish job is skipped rather than failed, and the binaries still ship.
#
# Nothing here runs on a normal push. A release happens only when someone tags.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tests must pass before anything is built
        run: python -m unittest
        working-directory: python
      # A tag that disagrees with the code publishes a version number that means
      # nothing, and PyPI never lets that number be used again.
      - name: The tag, the package, the module and the crate agree on the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(python -c "import tomllib; print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")
          module=$(cd python && python -c "import fence; print(fence.__version__)")
          crate=$(python -c "import tomllib; print(tomllib.load(open('rust/Cargo.toml','rb'))['package']['version'])")
          if [ "$tag" != "$declared" ] || [ "$tag" != "$module" ] || [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag, pyproject.toml $declared, fence.__version__ $module, Cargo.toml $crate"
            exit 1
          fi
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build
        working-directory: python
      - uses: actions/upload-artifact@v7
        with:
          name: distribution
          path: python/dist/

  publish:
    name: publish to PyPI
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # the OIDC token trusted publishing uses, and nothing else
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distribution
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  binaries:
    needs: build  # the version check and the tests, before anything ships
    # Building fence needs a C compiler, because the tree-sitter grammars are C.
    # On Windows that is the hard part (docs/BUILDING.md), so every release
    # carries a ready-made binary and nobody has to build one to try it.
    # Independent of PyPI: a release without the PyPI setup still gets these.
    name: fence binary (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: fence-linux-x86_64
          - os: macos-latest
            asset: fence-macos-arm64
          - os: windows-latest
            asset: fence-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v7
      - name: Tests must pass on this platform before it ships
        run: cargo test --release --locked
        working-directory: rust
      - name: Build
        run: cargo build --release --locked
        working-directory: rust
      - name: Name the binary
        shell: bash
        run: |
          src=rust/target/release/fence
          [ "$RUNNER_OS" = "Windows" ] && src="$src.exe"
          mkdir -p out
          cp "$src" "out/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  github-release:
    name: attach binaries to the GitHub release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write  # creating the release, and nothing else
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: fence-*
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum fence-* > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true
