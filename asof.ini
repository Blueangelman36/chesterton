; Numbers chesterton's documents state that a machine can re-check. Run `asof check`.
;
; Only the files listed here make claims. The measurements in README.md ("Measured on
; real code") are dated runs against named corpora and are not re-run by CI.

[asof]
include = README.md, python/README.md, python/pyproject.toml, .github/workflows/ci.yml

[python-version]
type = version
run = python -c "import tomllib; print(tomllib.load(open('python/pyproject.toml','rb'))['project']['requires-python'].lstrip('>='))"
why = The oldest Python the package installs on. Stated in both READMEs, enforced by
      requires-python, and tested by CI's package job. The root README said 3.10+
      while the package required 3.11, until 0.1.1.
