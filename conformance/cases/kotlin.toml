# Scheme 3 exists because a name renamed on the value side must not shift the
# numbering of an attribute spelled the same way. `body` is both a local and a
# method here; renaming the local must not read as a deletion.
[[case]]
name = "renaming a local does not renumber a method spelled the same way"
language = "kotlin"
expect = "renamed"
anchor_match = "if (body.contains"

[case.before]
"Parse.kt" = '''
package demo

object Parse {
    fun check(resp: Response): Boolean {
        val body = resp.body()
        if (body.contains(resp.body().trim())) {
            return true
        }
        return false
    }
}
'''

[case.after]
"Parse.kt" = '''
package demo

object Parse {
    fun check(resp: Response): Boolean {
        val payload = resp.body()
        if (payload.contains(resp.body().trim())) {
            return true
        }
        return false
    }
}
'''


