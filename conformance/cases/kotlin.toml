# The same questions, asked of Kotlin. An implementation that cannot read this
# language skips these cases.
#
# Kotlin names no fields on a member access: `a.b`, `a?.b`, `a::b` and `a!!.b`
# are all one `navigation_expression` with the receiver first and the name last.
# So the attribute namespace is decided positionally here, and the case below
# that renames a local next to a method of the same name is what proves it.

[[case]]
name = "a comment added above a statement does not disturb it"
language = "kotlin"
expect = "ok"
anchor_match = "if (resp.body().contains"

[case.before]
"Client.kt" = '''
package demo

class Client(private val http: Http) {
    fun fetch(url: String): Result {
        val resp = http.get(url)
        if (resp.body().contains("unauthorized")) {
            throw AuthError("200 with the error in the body")
        }
        return Result(resp.body())
    }
}
'''

[case.after]
"Client.kt" = '''
package demo

class Client(private val http: Http) {
    fun fetch(url: String): Result {
        val resp = http.get(url)
        // The vendor returns 200 on an auth failure.
        if (resp.body().contains("unauthorized")) {
            throw AuthError("200 with the error in the body")
        }
        return Result(resp.body())
    }
}
'''


