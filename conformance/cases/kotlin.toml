# A companion object carries no name in the grammar. Without one supplied, its
# members would land in the enclosing class's scope, where they can collide with
# instance members spelled the same way.
[[case]]
name = "a companion object is a scope of its own"
language = "kotlin"
expect = "ok"
expect_scope = "Worker.Companion.schedule"
anchor_match = "val request = PeriodicWorkRequestBuilder"

[case.before]
"Worker.kt" = '''
package demo

class Worker {
    fun schedule() {
        val request = "instance"
        use(request)
    }

    companion object {
        fun schedule() {
            val request = PeriodicWorkRequestBuilder(15, MINUTES)
            enqueue(request)
        }
    }
}
'''

[case.after]
"Worker.kt" = '''
package demo

class Worker {
    fun schedule() {
        val request = "instance"
        use(request)
    }

    companion object {
        fun schedule() {
            // Kept at 15 minutes; the platform rounds anything shorter up.
            val request = PeriodicWorkRequestBuilder(15, MINUTES)
            enqueue(request)
        }
    }
}
'''


# Gradle build files are Kotlin, and are where a project's load-bearing oddities
# tend to live: a pinned version, a signing config, a flag with a reason.
[[case]]
name = "a .kts build file is read as Kotlin"
language = "kotlin"
expect = "ok"
anchor_match = "buildConfig = true"

[case.before]
"build.gradle.kts" = '''
android {
    namespace = "com.example.app"
    compileSdk = 35

    buildFeatures {
        compose = true
        buildConfig = true
    }
}
'''

[case.after]
"build.gradle.kts" = '''
android {
    namespace = "com.example.app"
    compileSdk = 35

    buildFeatures {
        compose = true
        // VERSION_NAME, so the app can tell whether a release is newer than it.
        buildConfig = true
    }
}
'''


# Property delegation is ordinary Kotlin and is how this project reaches its
# settings store, so it has to survive being read.
[[case]]
name = "a delegated property is anchorable"
language = "kotlin"
expect = "renamed"
anchor_match = "private val Context.settingsStore"

[case.before]
"Settings.kt" = '''
package demo

private val Context.settingsStore: DataStore<Preferences> by preferencesDataStore("app_settings")

object AppSettings {
    fun read() = 1
}
'''

[case.after]
"Settings.kt" = '''
package demo

private val Context.appStore: DataStore<Preferences> by preferencesDataStore("app_settings")

object AppSettings {
    fun read() = 1
}
'''
