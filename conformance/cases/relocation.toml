[[case]]
name = "moved to another function in the same file"
expect = "moved"
expect_scope = "_check"
anchor_match = 'if resp.json()'

[case.before]
"app.py" = '''
class Client:
    def fetch(self, url):
        resp = self.session.get(url, timeout=10)
        if resp.json().get("error") == "unauthorized":
            raise AuthError(url)
        return resp
'''

[case.after]
"app.py" = '''
class Client:
    def fetch(self, url):
        resp = self.session.get(url, timeout=10)
        _check(resp, url)
        return resp


def _check(resp, url):
    if resp.json().get("error") == "unauthorized":
        raise AuthError(url)
'''


[[case]]
name = "moved to another file"
expect = "moved"
expect_file = "auth.py"
anchor_match = 'if resp.json()'

[case.before]
"app.py" = '''
class Client:
    def fetch(self, url):
        resp = self.session.get(url, timeout=10)
        if resp.json().get("error") == "unauthorized":
            raise AuthError(url)
        return resp
'''

[case.after]
"app.py" = '''
from auth import check


class Client:
    def fetch(self, url):
        resp = self.session.get(url, timeout=10)
        check(resp, url)
        return resp
'''
"auth.py" = '''
def check(resp, url):
    if resp.json().get("error") == "unauthorized":
        raise AuthError(url)
'''


