# Relocation basics: can an implementation still find the statement a note was
# pinned to? Every implementation must agree on these verdicts.
#
# Each case builds an anchor from the statement in `before` whose first line
# contains `anchor_match`, then locates it in `after`.

[[case]]
name = "unchanged code is found"
expect = "ok"
anchor_match = 'if resp.json()'

[case.before]
"app.py" = '''
class Client:
    def fetch(self, url):
        resp = self.session.get(url, timeout=10)
        if resp.json().get("error") == "unauthorized":
            raise AuthError(url)
        return resp
'''

[case.after]
"app.py" = '''
class Client:
    def fetch(self, url):
        resp = self.session.get(url, timeout=10)
        if resp.json().get("error") == "unauthorized":
            raise AuthError(url)
        return resp
'''


[[case]]
name = "reformatting, comments and shifted lines are ignored"
expect = "ok"
anchor_match = 'if resp.json()'

[case.before]
"app.py" = '''
class Client:
    def fetch(self, url):
        resp = self.session.get(url, timeout=10)
        if resp.json().get("error") == "unauthorized":
            raise AuthError(url)
        return resp
'''

[case.after]
"app.py" = '''
import os

# Vendor quirk, see ticket 412.
class Client:

    def fetch(self, url):
        resp = self.session.get(url, timeout=10)
        if resp.json().get(
            "error"
        ) == "unauthorized":  # still the same condition
            raise AuthError(url)
        return resp
'''


