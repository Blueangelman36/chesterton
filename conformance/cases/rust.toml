[[case]]
name = "renaming a local does not renumber a field spelled the same way"
language = "rust"
expect = "renamed"
anchor_match = "if len > self.len"

[case.before]
"buffer.rs" = '''
impl Buffer {
    pub fn push(&mut self, data: &[u8]) -> bool {
        let len = data.len();
        if len > self.len {
            return false;
        }
        true
    }
}
'''

[case.after]
"buffer.rs" = '''
impl Buffer {
    pub fn push(&mut self, data: &[u8]) -> bool {
        let size = data.len();
        if size > self.len {
            return false;
        }
        true
    }
}
'''


[[case]]
name = "a statement that moves to another impl in another file is followed"
language = "rust"
expect = "moved"
expect_file = "guard.rs"
expect_scope = "Guard.verify"
anchor_match = "if body.contains(\"unauthorized\")"

[case.before]
"client.rs" = '''
impl Client {
    pub fn fetch(&self, url: &str) -> Result<String, Error> {
        let body = self.http.get(url)?;
        if body.contains("unauthorized") {
            return Err(Error::Auth("200 with the error in the body"));
        }
        Ok(body)
    }
}
'''

[case.after]
"client.rs" = '''
impl Client {
    pub fn fetch(&self, url: &str) -> Result<String, Error> {
        let body = self.http.get(url)?;
        Guard::verify(&body)?;
        Ok(body)
    }
}
'''
"guard.rs" = '''
impl Guard {
    pub fn verify(body: &str) -> Result<(), Error> {
        if body.contains("unauthorized") {
            return Err(Error::Auth("200 with the error in the body"));
        }
        Ok(())
    }
}
'''


