# The same questions, asked of Rust. An implementation that cannot read this
# language skips these cases.
#
# Rust differs from the other languages in three ways that matter here: a field
# is the same name in `a.len`, `len: u32` and `Point { len: 3 }`, so it lives in
# the attribute namespace wherever it appears; an `impl` names no scope of its
# own but lends one to a type, and a trait impl is qualified so `Display::fmt`
# and `Debug::fmt` on one type stay apart; and comments come in two node kinds,
# neither called `comment`.

[[case]]
name = "a comment added above a statement does not disturb it"
language = "rust"
expect = "ok"
anchor_match = "if body.contains(\"unauthorized\")"

[case.before]
"client.rs" = '''
impl Client {
    pub fn fetch(&self, url: &str) -> Result<String, Error> {
        let body = self.http.get(url)?;
        if body.contains("unauthorized") {
            return Err(Error::Auth("200 with the error in the body"));
        }
        Ok(body)
    }
}
'''

[case.after]
"client.rs" = '''
impl Client {
    /// Fetch a page, treating the vendor's 200-with-an-error as the failure it is.
    pub fn fetch(&self, url: &str) -> Result<String, Error> {
        let body = self.http.get(url)?;
        // The vendor returns 200 on an auth failure.
        if body.contains("unauthorized") { /* see the ticket */
            return Err(Error::Auth("200 with the error in the body"));
        }
        Ok(body)
    }
}
'''


