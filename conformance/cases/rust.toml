[[case]]
name = "a trait impl is a scope of its own"
language = "rust"
expect = "ok"
expect_scope = "<Point as Display>.fmt"
anchor_match = "write!(f, \"({}, {})\", self.x, self.y)"

[case.before]
"point.rs" = '''
impl fmt::Display for Point {
    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
        write!(f, "({}, {})", self.x, self.y)
    }
}
'''

[case.after]
"point.rs" = '''
impl fmt::Debug for Point {
    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
        f.debug_struct("Point").field("x", &self.x).finish()
    }
}

impl fmt::Display for Point {
    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
        write!(f, "({}, {})", self.x, self.y)
    }
}
'''


[[case]]
name = "a match arm is anchorable, and survives its neighbours changing"
language = "rust"
expect = "ok"
anchor_match = "Some(n) if n == 0 =>"

[case.before]
"retry.rs" = '''
fn delay(attempt: Option<u32>) -> u64 {
    match attempt {
        None => 0,
        Some(n) if n == 0 => 50,
        Some(n) => 100 * u64::from(n),
    }
}
'''

[case.after]
"retry.rs" = '''
fn delay(attempt: Option<u32>) -> u64 {
    match attempt {
        None => 10,
        Some(n) if n == 0 => 50,
        Some(n) => 250 * u64::from(n).min(8),
    }
}
'''


