# The same questions, asked of TypeScript. An implementation that cannot read
# this language skips these cases; one that can must reach the same verdicts it
# reaches for Python, because the rules are about code, not about syntax.

[[case]]
name = "unchanged code is found"
language = "typescript"
expect = "ok"
anchor_match = "if (response.status === 200"

[case.before]
"client.ts" = '''
export class Client {
  async fetch(url: string): Promise<Response> {
    const response = await this.session.get(url, { timeout: 10 });
    if (response.status === 200 && response.body.error === "unauthorized") {
      throw new AuthError(url);
    }
    return response;
  }
}
'''

[case.after]
"client.ts" = '''
export class Client {
  async fetch(url: string): Promise<Response> {
    const response = await this.session.get(url, { timeout: 10 });
    if (response.status === 200 && response.body.error === "unauthorized") {
      throw new AuthError(url);
    }
    return response;
  }
}
'''


[[case]]
name = "reformatting and comments are ignored"
language = "typescript"
expect = "ok"
anchor_match = "if (response.status === 200"

[case.before]
"client.ts" = '''
export class Client {
  async fetch(url: string): Promise<Response> {
    const response = await this.session.get(url, { timeout: 10 });
    if (response.status === 200 && response.body.error === "unauthorized") {
      throw new AuthError(url);
    }
    return response;
  }
}
'''

[case.after]
"client.ts" = '''
import { AuthError } from "./errors";

export class Client {

  async fetch(url: string): Promise<Response> {
    const response = await this.session.get(url, { timeout: 10 });

    // The vendor answers 200 even when the credentials are wrong.
    if (response.status === 200 &&
        response.body.error === "unauthorized") {
      throw new AuthError(url);
    }

    return response;
  }
}
'''


