[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chesterton"
version = "0.1.0"
description = "Remember why code exists, and speak up before it's removed."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fence = "fence.cli:main"

[tool.setuptools]
packages = ["fence"]
